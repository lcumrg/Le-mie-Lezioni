[build]
  command = "npm run build"
  publish = "dist"

# Cache asset hashati (JS/CSS/immagini) per 1 anno
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML sempre rivalidato per aggiornamenti immediati
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA redirect — all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
